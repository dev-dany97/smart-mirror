# Secret scan configuration (used by the "Secret scan" GitHub Action).
# Uses the default gitleaks rules and only ignores the documented placeholders.
title = "smart-mirror"

[extend]
useDefault = true

[allowlist]
description = "Placeholders, not real secrets"
regexes = [
  '''YOUR_[A-Z_]+''',
  '''\$\{[A-Z0-9_]+\}''',
  '''your-[a-z0-9-]+''',
  '''superstrongpassword''',
]
